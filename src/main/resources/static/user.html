<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h2>JKUSDA</h2>
    <div class="header-actions">
        <button class="nav-btn" onclick="goToMessages()">New Message</button>
        <button class="nav-btn" onclick="goToDashboard()">Dashboard</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<!-- CONTENT -->
<div class="container">

    <div class="dashboard-header">
        <h3 style="margin-bottom:30px;">My Messages</h3>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Message</th>
            <th>Status</th>
            <th>Date</th>
        </tr>
        </thead>
        <tbody id="myMessagesTable"></tbody>
    </table>

    <h3 style="margin-top:10px;">My Appointments</h3>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Message</th>
            <th>Start</th>
            <th>End</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="myAppointmentsTable"></tbody>
    </table>

</div>

<div id="toastContainer" class="toast-container"></div>

<script src="api.js"></script>
<script src="user.js"></script>
</body>
</html>
