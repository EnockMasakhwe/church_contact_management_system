<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="header auth-header">
    <a class="brand" href="login.html">JKUSDA</a>
    <nav class="auth-nav" aria-label="Account navigation">
        <a class="active" href="login.html" aria-current="page">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main class="auth-page">
<div class="auth-container">
    <h2>Student Login</h2>
    <p class="auth-subtitle">Welcome back! Please login to your account.</p>

    <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <button type="submit" class="primary-btn">Login</button>
    </form>

    <p class="auth-links">Don't have an account? <a href="register.html">Sign Up</a><br>
        Forgot your password? <a href="javascript:void(0)" onclick="toggleForgotPassword()">Reset</a><br>
        Didn't receive a verification email? <a href="javascript:void(0)" onclick="toggleResendVerification()">Resend</a></p>

    <div id="forgotPasswordBox" style="display:none;">
        <label for="forgotEmail">Email Address</label>
        <input type="email" id="forgotEmail" autocomplete="email" placeholder="Enter your email">
        <button type="button" class="primary-btn" onclick="sendResetLink()">Send Reset Link</button>
    </div>

    <div id="resendVerificationBox" style="display:none;">
        <label for="verificationEmail">Email Address</label>
        <input type="email" id="verificationEmail" autocomplete="email" placeholder="Enter your email">
        <button type="button" class="primary-btn" onclick="resendVerificationEmail()">Resend Verification Email</button>
        <p id="forgotMsg"></p>
    </div>
</div>
</main>

<div id="toastContainer" class="toast-container"></div>

<script src="api.js"></script>
<script src="login.js"></script>
</body>
</html>
