<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="header auth-header">
    <a class="brand" href="login.html">JKUSDA</a>
    <nav class="auth-nav" aria-label="Account navigation">
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main class="auth-page">
<div class="auth-container">
    <h2>Reset Your Password</h2>
    <p class="auth-subtitle">Enter your new password below.</p>
    <label for="newPassword">New Password</label>
    <input type="password" id="newPassword" autocomplete="new-password">
    <label for="confirmPassword">Confirm Password</label>
    <input type="password" id="confirmPassword" autocomplete="new-password">

    <button class="primary-btn" onclick="resetPassword()">Reset Password</button>

    <p id="msg"></p>
</div>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    async function resetPassword() {
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const msg = document.getElementById("msg");

        if (!token) {
            msg.innerText = "The password reset link is invalid or incomplete.";
            return;
        }

        if (!newPassword || !confirmPassword) {
            msg.innerText = "Please fill in all fields";
            return;
        }

        if (newPassword !== confirmPassword) {
            msg.innerText = "Passwords do not match";
            return;
        }

        try {
            const result = await apiFetch("/api/auth/reset-password", {
                method: "POST",
                body: JSON.stringify({
                    token: token,
                    newPassword: newPassword
                })
            });

            msg.innerText = result;

            setTimeout(() => {
                window.location.href = "login.html";
            }, 3000);

        } catch (error) {
            msg.innerText = error.message;
        }
    }
</script>

<script src="api.js"></script>
</body>
</html>
