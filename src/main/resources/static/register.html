<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="header auth-header">
    <a class="brand" href="login.html">JKUSDA</a>
    <nav class="auth-nav" aria-label="Account navigation">
        <a href="login.html">Login</a>
        <a class="active" href="register.html" aria-current="page">Register</a>
    </nav>
</header>

<main class="auth-page">
<div class="auth-container">
    <h2>Student Registration</h2>
    <p class="auth-subtitle">Create your account to get started.</p>
    <form id="registerForm">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
        <label for="email">Email Address</label>
        <input type="email" id="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required>

        <button type="submit" class="primary-btn">Register</button>
    </form>
    <p class="auth-links">Already have an account? <a href="login.html">Login</a></p>
</div>
</main>

<div id="toastContainer" class="toast-container"></div>

<script src="api.js"></script>
<script src="register.js"></script>
</body>
</html>
